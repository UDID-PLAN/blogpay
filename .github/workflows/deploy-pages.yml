name: Deploy to GitHub Pages

# main에 푸시하면 인덱스·기획서(docs)·공통 CSS(src/doc.css)·공유본(published)을 배포한다. (작업 원본 requests/, tools/ 는 배포하지 않음)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir _site
          cp index.html _site/
          [ -d docs ] && cp -r docs _site/ || true
          mkdir -p _site/src && cp src/doc.css _site/src/
          [ -d published ] && cp -r published _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
