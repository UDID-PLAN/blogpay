<div class="step-cell"><h4>할 일</h4><ol><li>커머스 관리자 [시작하기] &gt; [제품 링크 추가]</li><li>제품이나 서비스 : 온라인 제품</li><li>비즈니스 포트폴리오 선택, 카탈로그 이름 입력</li><li>데이터를 연결하세요 : 블로그페이에 입력한 픽셀의 데이터 세트 [연결] → [다음]</li></ol></div>
<div class="step-cell"><h4>입력값</h4><ul><li>카탈로그 이름 : 판매자 지정 (예: 카탈로그_쇼핑몰명)</li><li>데이터 세트 : 블로그페이 페이스북 픽셀ID와 같은 데이터 세트</li></ul></div>
<div class="step-cell"><h4>주의사항</h4><ul><li>제품 유형(온라인 제품)은 <span class="ref">나중에 변경 불가</span></li><li>파트너 플랫폼에 연결 : 사용 안 함</li></ul></div>
