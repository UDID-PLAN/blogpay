<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BlogPay 기획서 인덱스</title>
<style>
{{CSS}}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">BlogPay</span>
  <span class="topbar-meta">updated {{UPDATED}}</span>
</header>
<div class="shell full">
  <main class="content">
    <div class="eyebrow">BlogPay · Planning Docs</div>
    <h1>블로그페이 기획서</h1>
    <p class="meta">블로그페이 관련 기획 문서를 보관하고 관리하는 공간입니다.</p>

    <h2>서비스 공통 링크</h2>
{{COMMON}}

    <h2>요청 리스트</h2>
{{REQUESTS}}
  </main>
</div>
<script>
(function () {
  var rows = [].slice.call(document.querySelectorAll('.index-table tbody tr[data-status]'));
  var state = { status: '', project: '', q: '' };
  var count = document.getElementById('result-count');
  var empty = document.getElementById('empty-row');
  function apply() {
    var shown = 0;
    rows.forEach(function (tr) {
      var ok = (!state.status || tr.dataset.status === state.status) &&
               (!state.project || tr.dataset.project === state.project) &&
               (!state.q || tr.dataset.q.indexOf(state.q) > -1);
      tr.hidden = !ok;
      if (ok) shown++;
    });
    count.textContent = '총 ' + shown + '건' + (shown !== rows.length ? ' (전체 ' + rows.length + '건)' : '');
    empty.hidden = shown !== 0;
  }
  [].slice.call(document.querySelectorAll('.fchip')).forEach(function (btn) {
    btn.addEventListener('click', function () {
      var g = btn.dataset.group;
      [].slice.call(document.querySelectorAll('.fchip[data-group="' + g + '"]')).forEach(function (x) {
        x.classList.toggle('active', x === btn);
        x.setAttribute('aria-pressed', x === btn ? 'true' : 'false');
      });
      state[g] = btn.dataset.value;
      apply();
    });
  });
  document.getElementById('q').addEventListener('input', function (e) {
    state.q = e.target.value.trim().toLowerCase();
    apply();
  });
  apply();
})();
</script>
</body>
</html>
