<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BlogPay 기획서 인덱스</title>
<style>
{{CSS}}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">BlogPay</span>
  <span class="topbar-meta">updated {{UPDATED}}</span>
</header>
<div class="shell full">
  <main class="content">
    <div class="eyebrow">BlogPay · Planning Docs</div>
    <h1>블로그페이 기획서</h1>
    <p class="meta">블로그페이 관련 기획 문서를 보관하고 관리하는 공간입니다.</p>

    <h2>서비스 공통 링크</h2>
{{COMMON}}

    <h2>요청 리스트</h2>
{{REQUESTS}}
  </main>
</div>
<script>
(function () {
  var rows = [].slice.call(document.querySelectorAll('.index-table tbody tr[data-status]'));
  var state = { status: '', project: '', q: '' };
  var count = document.getElementById('result-count');
  var empty = document.getElementById('empty-row');
  function apply() {
    var shown = 0;
    rows.forEach(function (tr) {
      var ok = (!state.status || tr.dataset.status === state.status) &&
               (!state.project || tr.dataset.project === state.project) &&
               (!state.q || tr.dataset.q.indexOf(state.q) > -1);
      tr.hidden = !ok;
      if (ok) shown++;
    });
    count.textContent = '총 ' + shown + '건' + (shown !== rows.length ? ' (전체 ' + rows.length + '건)' : '');
    empty.hidden = shown !== 0;
  }
  [].slice.call(document.querySelectorAll('.fchip')).forEach(function (btn) {
    btn.addEventListener('click', function () {
      var g = btn.dataset.group;
      [].slice.call(document.querySelectorAll('.fchip[data-group="' + g + '"]')).forEach(function (x) {
        x.classList.toggle('active', x === btn);
        x.setAttribute('aria-pressed', x === btn ? 'true' : 'false');
      });
      state[g] = btn.dataset.value;
      apply();
    });
  });
  document.getElementById('q').addEventListener('input', function (e) {
    state.q = e.target.value.trim().toLowerCase();
    apply();
  });
  apply();
})();

// [기획 추출] docs/ 기획서는 CSS를 링크로 쓰므로, 내려받을 때 src/doc.css를 다시 내장해 단일 파일(공유본)로 만든다.
document.addEventListener('click', async (e) => {
  const a = e.target.closest('a[data-extract]');
  if (!a) return;
  e.preventDefault();
  try {
    const [html, css] = await Promise.all([fetch(a.getAttribute('href')).then((r) => r.text()), fetch('src/doc.css').then((r) => r.text())]);
    const out = html.replace(new RegExp('<' + 'link rel="stylesheet" href="[^"]*doc\\.css">'), () => '<style>\n' + css + '\n</style>');
    const url = URL.createObjectURL(new Blob([out], { type: 'text/html' }));
    const d = document.createElement('a'); d.href = url; d.download = a.getAttribute('download'); document.body.appendChild(d); d.click(); d.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (err) { alert('기획 추출에 실패했습니다. 잠시 후 다시 시도해 주세요.'); }
});
</script>
</body>
</html>
